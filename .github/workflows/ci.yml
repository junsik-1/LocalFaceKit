name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build and test
        run: swift test
      - name: Build for iOS Simulator
        run: >-
          xcodebuild
          -scheme LocalFaceKit
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/LocalFaceKitDerivedData"
          CODE_SIGNING_ALLOWED=NO
          build
